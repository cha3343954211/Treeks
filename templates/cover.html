<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{title}}</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1a1a1a;
      font-size: 14px;
      line-height: 1.7;
    }
    .cover {
      background: linear-gradient(135deg, #4c995c 0%, #3b8a48 50%, #2d6e38 100%);
      color: white;
      padding: 60px 40px 40px;
      page-break-after: always;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .cover::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15), transparent 70%);
      border-radius: 50%;
    }
    .cover::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
      border-radius: 50%;
    }
    .cover-brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3em;
      opacity: 0.85;
      margin-bottom: 30px;
      text-transform: uppercase;
    }
    .cover-title {
      font-size: 38px;
      font-weight: 800;
      margin: 0 0 20px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .cover-meta {
      font-size: 14px;
      opacity: 0.9;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cover-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cover-tags {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cover-tag {
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      font-size: 12px;
    }
    .page {
      padding: 40px 36px;
    }
    .content { color: #2a2a2a; }
    .content h1, .content h2, .content h3, .content h4 {
      color: #1a1a1a;
      font-weight: 700;
      margin: 24px 0 12px;
      line-height: 1.3;
    }
    .content h1 { font-size: 22px; color: #4c995c; }
    .content h2 { font-size: 18px; padding-left: 12px; border-left: 4px solid #4c995c; }
    .content h3 { font-size: 16px; }
    .content h4 { font-size: 14px; }
    .content p { margin: 12px 0; }
    .content a { color: #4c995c; text-decoration: none; font-weight: 500; }
    .content strong { font-weight: 700; color: #1a1a1a; }
    .content em { font-style: italic; }
    .content del { color: #999; }
    .content ul, .content ol { margin: 12px 0; padding-left: 24px; }
    .content li { margin: 4px 0; }
    .content blockquote {
      margin: 14px 0;
      padding: 12px 18px;
      background: #f4f8f4;
      border-left: 3px solid #4c995c;
      border-radius: 0 6px 6px 0;
      color: #3a4a3d;
    }
    .content code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      background: #f0f0f0;
      border-radius: 4px;
      color: #c45a4f;
    }
    .content pre {
      margin: 14px 0;
      padding: 14px 16px;
      background: #1e221e;
      color: #e0e0e0;
      border-radius: 8px;
      overflow-x: auto;
      page-break-inside: avoid;
    }
    .content pre code {
      padding: 0;
      background: transparent;
      color: #e0e0e0;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
    }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13px;
      page-break-inside: avoid;
    }
    .content th, .content td {
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      text-align: left;
    }
    .content th {
      background: #4c995c;
      color: white;
      font-weight: 600;
    }
    .content tr:nth-child(even) td { background: #f9f9f9; }
    .content hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 20px 0;
    }
    .footer {
      margin-top: 36px;
      padding-top: 14px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      font-size: 11px;
      color: #999;
    }
    .footer .brand {
      color: #4c995c;
      font-weight: 600;
    }
    h1, h2, h3, h4 { page-break-after: avoid; }
    pre, blockquote, table, img { page-break-inside: avoid; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-brand">Treeks</div>
    <h1 class="cover-title">{{title}}</h1>
    <div class="cover-meta">
      {{#if author}}<div class="cover-meta-item">作者: {{author}}</div>{{/if}}
      {{#if date}}<div class="cover-meta-item">日期: {{date}}</div>{{/if}}
      {{#if mood}}<div class="cover-meta-item">心情: {{mood}}</div>{{/if}}
      {{#if weather}}<div class="cover-meta-item">天气: {{weather}}</div>{{/if}}
    </div>
    {{#if tags}}
    <div class="cover-tags">
      {{#each tags}}<span class="cover-tag">{{this}}</span>{{/each}}
    </div>
    {{/if}}
  </div>
  <div class="page">
    <div class="content">
      {{{content}}}
    </div>
    <div class="footer">
      <span class="brand">Treeks</span> · 导出于 {{exportDate}}
    </div>
  </div>
</body>
</html>
