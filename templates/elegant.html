<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{title}}</title>
  <style>
    @page {
      size: A4;
      margin: 25mm 25mm 25mm 25mm;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: "New York", "Iowan Old Style", Georgia, "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", serif;
      color: #2c2c2c;
      font-size: 14px;
      line-height: 1.85;
    }
    .page { padding: 0; }
    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 18px;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 10px 0;
      letter-spacing: 0.02em;
    }
    .meta {
      font-size: 12px;
      color: #888;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .meta-item + .meta-item::before {
      content: '·';
      margin-right: 14px;
      color: #ccc;
    }
    .tags {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: #aaa;
    }
    .tag + .tag::before {
      content: ' / ';
      color: #ddd;
      margin: 0 4px;
    }
    .content { color: #2c2c2c; }
    .content h1, .content h2, .content h3, .content h4 {
      color: #1a1a1a;
      font-weight: 700;
      margin: 26px 0 14px;
      line-height: 1.4;
    }
    .content h1 { font-size: 20px; text-align: center; }
    .content h2 { font-size: 18px; }
    .content h3 { font-size: 16px; }
    .content h4 { font-size: 14px; }
    .content p {
      margin: 14px 0;
      text-indent: 2em;
      text-align: justify;
    }
    .content a { color: #555; text-decoration: underline; text-underline-offset: 2px; }
    .content strong { font-weight: 700; color: #1a1a1a; }
    .content em { font-style: italic; }
    .content del { color: #aaa; }
    .content ul, .content ol { margin: 14px 0; padding-left: 2em; }
    .content li { margin: 6px 0; text-indent: 0; }
    .content li p { text-indent: 0; }
    .content blockquote {
      margin: 18px 0;
      padding: 8px 18px;
      border-left: 2px solid #ccc;
      color: #555;
      font-style: italic;
    }
    .content blockquote p { text-indent: 0; }
    .content code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 1px 5px;
      background: #f4f4f4;
      border-radius: 3px;
      color: #c45a4f;
    }
    .content pre {
      margin: 16px 0;
      padding: 14px 18px;
      background: #f9f9f7;
      border: 1px solid #ececec;
      border-radius: 4px;
      overflow-x: auto;
      page-break-inside: avoid;
    }
    .content pre code {
      padding: 0;
      background: transparent;
      color: #2c2c2c;
      font-size: 12px;
      line-height: 1.6;
    }
    .content img {
      max-width: 100%;
      height: auto;
      margin: 16px auto;
      display: block;
    }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 12.5px;
      page-break-inside: avoid;
    }
    .content th, .content td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .content th {
      background: #f4f4f4;
      font-weight: 600;
    }
    .content hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 24px auto;
      width: 30%;
    }
    .footer {
      margin-top: 40px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 11px;
      color: #aaa;
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    h1, h2, h3, h4 { page-break-after: avoid; }
    pre, blockquote, table, img { page-break-inside: avoid; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1 class="title">{{title}}</h1>
      <div class="meta">
        {{#if author}}<span class="meta-item">{{author}}</span>{{/if}}
        {{#if date}}<span class="meta-item">{{date}}</span>{{/if}}
        {{#if mood}}<span class="meta-item">{{mood}}</span>{{/if}}
        {{#if weather}}<span class="meta-item">{{weather}}</span>{{/if}}
      </div>
      {{#if tags}}
      <div class="tags">
        {{#each tags}}<span class="tag">{{this}}</span>{{/each}}
      </div>
      {{/if}}
    </div>
    <div class="content">
      {{{content}}}
    </div>
    <div class="footer">
      Treeks · {{exportDate}}
    </div>
  </div>
</body>
</html>
