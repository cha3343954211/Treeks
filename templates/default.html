<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{title}}</title>
  <style>
    @page {
      size: A4;
      margin: 20mm 18mm 22mm 18mm;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #1d2a20;
      font-size: 14px;
      line-height: 1.75;
      letter-spacing: -0.01em;
    }
    .page {
      padding: 0;
    }
    .header {
      border-bottom: 2px solid #4c995c;
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #1d2a20;
      margin: 0 0 8px 0;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #7a8a7c;
      align-items: center;
    }
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .meta-item::before {
      content: '';
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #4c995c;
      opacity: 0.6;
    }
    .meta-item:first-child::before { display: none; }
    .meta-item.date::before { display: inline-block; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tag {
      display: inline-block;
      padding: 2px 10px;
      background: rgba(76, 153, 92, 0.1);
      color: #4c995c;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .content {
      color: #2a3a2d;
    }
    .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
      color: #1d2a20;
      font-weight: 700;
      margin: 22px 0 12px;
      line-height: 1.3;
    }
    .content h1 { font-size: 22px; padding-bottom: 6px; border-bottom: 1px solid #e6f0e8; }
    .content h2 { font-size: 19px; padding-bottom: 4px; border-bottom: 1px solid #e6f0e8; }
    .content h3 { font-size: 16px; }
    .content h4 { font-size: 14px; }
    .content p { margin: 12px 0; }
    .content a { color: #4c995c; text-decoration: none; border-bottom: 1px solid rgba(76, 153, 92, 0.3); }
    .content strong { font-weight: 700; color: #1d2a20; }
    .content em { font-style: italic; }
    .content del { color: #7a8a7c; }
    .content ul, .content ol { margin: 12px 0; padding-left: 24px; }
    .content li { margin: 4px 0; }
    .content li input[type="checkbox"] {
      margin-right: 6px;
      vertical-align: middle;
    }
    .content blockquote {
      margin: 14px 0;
      padding: 10px 16px;
      background: rgba(76, 153, 92, 0.05);
      border-left: 3px solid #4c995c;
      color: #3a4a3d;
      border-radius: 0 6px 6px 0;
    }
    .content blockquote p { margin: 6px 0; }
    .content code {
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      color: #c45a4f;
    }
    .content pre {
      margin: 14px 0;
      padding: 14px 16px;
      background: #f6f8f6;
      border: 1px solid #e6f0e8;
      border-radius: 8px;
      overflow-x: auto;
      page-break-inside: avoid;
    }
    .content pre code {
      padding: 0;
      background: transparent;
      color: #1d2a20;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
    }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13px;
      page-break-inside: avoid;
    }
    .content th, .content td {
      border: 1px solid #e6f0e8;
      padding: 8px 12px;
      text-align: left;
    }
    .content th {
      background: rgba(76, 153, 92, 0.08);
      font-weight: 600;
      color: #1d2a20;
    }
    .content tr:nth-child(even) td { background: rgba(0, 0, 0, 0.015); }
    .content hr {
      border: none;
      border-top: 1px solid #e6f0e8;
      margin: 20px 0;
    }
    .footer {
      margin-top: 32px;
      padding-top: 12px;
      border-top: 1px dashed #e6f0e8;
      text-align: center;
      font-size: 11px;
      color: #b0bcb1;
    }
    .footer .brand {
      color: #4c995c;
      font-weight: 600;
    }
    /* 分页控制 */
    h1, h2, h3, h4, h5, h6 { page-break-after: avoid; }
    pre, blockquote, table, img { page-break-inside: avoid; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1 class="title">{{title}}</h1>
      <div class="meta">
        {{#if author}}<span class="meta-item author">{{author}}</span>{{/if}}
        {{#if mood}}<span class="meta-item mood">心情: {{mood}}</span>{{/if}}
        {{#if weather}}<span class="meta-item weather">天气: {{weather}}</span>{{/if}}
        {{#if date}}<span class="meta-item date">{{date}}</span>{{/if}}
      </div>
      {{#if tags}}
      <div class="tags">
        {{#each tags}}<span class="tag">{{this}}</span>{{/each}}
      </div>
      {{/if}}
    </div>
    <div class="content">
      {{{content}}}
    </div>
    <div class="footer">
      <span class="brand">Treeks</span> · 导出于 {{exportDate}}
    </div>
  </div>
</body>
</html>
