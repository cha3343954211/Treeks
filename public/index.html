<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treeks · 日记</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" id="hljs-theme" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 登录注册页 -->
    <section id="auth-view" class="view auth-view">
      <!-- 装饰叶子 -->
      <svg class="deco-leaf leaf-1" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8C20 16 14 26 14 38c0 10 8 18 18 18s18-8 18-18c0-12-6-22-18-30z" fill="currentColor" opacity="0.85"/>
        <path d="M32 14v36" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <path d="M32 22c-3 1-5 3-6 6M32 30c-4 1-7 3-9 7M32 38c-3 1-5 3-6 6" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none"/>
      </svg>
      <svg class="deco-leaf leaf-2" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8C20 16 14 26 14 38c0 10 8 18 18 18s18-8 18-18c0-12-6-22-18-30z" fill="currentColor" opacity="0.7"/>
        <path d="M32 14v36" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <svg class="deco-leaf leaf-3" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8C20 16 14 26 14 38c0 10 8 18 18 18s18-8 18-18c0-12-6-22-18-30z" fill="currentColor" opacity="0.6"/>
      </svg>
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
              <path d="M32 6L12 28h8L14 44h12v12h12V44h12l-6-16h8L32 6z" fill="url(#treeGrad)"/>
              <defs>
                <linearGradient id="treeGrad" x1="32" y1="6" x2="32" y2="56" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#6dbb7d"/>
                  <stop offset="1" stop-color="#3b8a48"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 id="site-name">Treeks</h1>
          <p class="auth-subtitle">记录生活中的每一片绿叶</p>
          <div id="site-notice" class="site-notice" style="display:none;"></div>
        </div>
        <div class="auth-tabs" id="auth-tabs">
          <button class="auth-tab active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register" id="register-tab">注册</button>
        </div>
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="请输入用户名" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="reg-username" placeholder="中英文/数字/下划线, 2-20位" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>昵称（可选）</label>
            <input type="text" id="reg-nickname" placeholder="显示在日记中的名字" autocomplete="nickname">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="至少 6 位" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <div id="auth-message" class="auth-message"></div>
      </div>
    </section>

    <!-- 主应用 -->
    <section id="main-view" class="view main-view" style="display:none;">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M32 6L12 28h8L14 44h12v12h12V44h12l-6-16h8L32 6z" fill="url(#sidebarTreeGrad)"/>
              <defs>
                <linearGradient id="sidebarTreeGrad" x1="32" y1="6" x2="32" y2="56" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#6dbb7d"/>
                  <stop offset="1" stop-color="#3b8a48"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand">Treeks</span>
        </div>
        <div class="user-card" id="user-card">
          <div class="avatar" id="user-avatar"></div>
          <div class="user-info">
            <div class="user-name" id="user-name">用户</div>
            <div class="user-handle" id="user-handle">@username</div>
          </div>
        </div>
        <button class="btn btn-primary btn-block nav-new" id="btn-new-diary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          写新日记
        </button>
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <nav class="sidebar-nav">
            <button class="nav-item active" data-nav="list">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>
              全部日记
            </button>
            <button class="nav-item" data-nav="pinned">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L8 6v6L4 16h6v6l2-2 2 2v-6h6l-4-4V6l-4-4z"/>
              </svg>
              置顶日记
            </button>
            <button class="nav-item" data-nav="stats">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <rect x="7" y="13" width="3" height="5"/>
                <rect x="12" y="9" width="3" height="9"/>
                <rect x="17" y="5" width="3" height="13"/>
              </svg>
              统计概览
            </button>
            <button class="nav-item" data-nav="images">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              我的图片
            </button>
            <button class="nav-item" data-nav="calendar">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              日历日程
            </button>
            <button class="nav-item" data-nav="friends">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              好友
              <span class="nav-badge" id="badge-friends" style="display:none;"></span>
            </button>
            <button class="nav-item" data-nav="letters">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              信件
              <span class="nav-badge" id="badge-letters" style="display:none;"></span>
            </button>
            <button class="nav-item" data-nav="shared">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
              共享日记
            </button>
            <button class="nav-item" data-nav="theme">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
              </svg>
              主题设置
            </button>
            <button class="nav-item" data-nav="my-data">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
              </svg>
              我的数据
            </button>
          </nav>
        </div>
        <div class="nav-section admin-section" id="admin-nav-section" style="display:none;">
          <div class="nav-section-title">管理</div>
          <nav class="sidebar-nav">
            <button class="nav-item" data-nav="admin-dashboard">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
              管理概览
            </button>
            <button class="nav-item" data-nav="admin-users">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              用户管理
            </button>
            <button class="nav-item" data-nav="admin-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              平台设置
            </button>
            <button class="nav-item" data-nav="admin-system">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              系统性能
            </button>
            <button class="nav-item" data-nav="admin-logs">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              操作日志
            </button>
            <button class="nav-item" data-nav="admin-data">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              数据管理
            </button>
          </nav>
        </div>
        <div class="sidebar-footer">
          <div class="nav-section-title">设置</div>
          <button class="nav-item" id="btn-profile">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            个人设置
          </button>
          <button class="nav-item" id="btn-logout">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            退出登录
          </button>
        </div>
      </aside>

      <main class="content">
        <!-- 顶部栏 -->
        <header class="topbar">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.5" y2="16.5"/>
            </svg>
            <input type="text" id="search-input" placeholder="搜索日记标题或内容...">
            <button class="btn-clear-search" id="clear-search" style="display:none;">
              <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
          <div class="topbar-actions">
            <select id="filter-tag" class="filter-select">
              <option value="">所有标签</option>
            </select>
            <input type="date" id="filter-date" class="filter-date">
            <button class="btn btn-ghost btn-icon" id="btn-reset-filter" title="重置筛选">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- 列表视图 -->
        <div id="view-list" class="content-view active">
          <div class="content-header">
            <h2 id="list-title">全部日记</h2>
            <span class="content-count" id="list-count"></span>
            <div class="content-header-actions">
              <button class="btn btn-ghost btn-sm" id="btn-toggle-select" title="批量选择">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                批量选择
              </button>
              <button class="btn btn-ghost btn-sm" id="btn-export-all" title="导出当前列表">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出全部
              </button>
            </div>
          </div>
          <div class="batch-select-bar" id="batch-select-bar" style="display:none;">
            <label class="checkbox select-all-label">
              <input type="checkbox" id="select-all-checkbox"> 全选当前页
            </label>
            <span class="batch-count" id="batch-count">已选 0 篇</span>
            <div class="batch-actions">
              <button class="btn btn-primary btn-sm" id="btn-batch-export" disabled>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出选中
              </button>
              <button class="btn btn-ghost btn-sm" id="btn-cancel-select">取消</button>
            </div>
          </div>
          <div id="diary-list" class="diary-list"></div>
          <div id="list-pagination" class="pagination"></div>
        </div>

        <!-- 编辑器视图 -->
        <div id="view-editor" class="content-view">
          <div class="editor-header">
            <button class="btn btn-ghost" id="btn-back-list">← 返回</button>
            <div class="editor-meta">
              <input type="text" id="editor-title" class="editor-title-input" placeholder="无标题">
              <div class="editor-options">
                <input type="text" id="editor-mood" class="meta-input" placeholder="心情 😊" maxlength="20">
                <input type="text" id="editor-weather" class="meta-input" placeholder="天气 ☀️" maxlength="20">
                <input type="text" id="editor-tags" class="meta-input" placeholder="标签 (逗号分隔)" maxlength="100">
              </div>
            </div>
          </div>
          <div class="editor-toolbar">
            <div class="tool-group">
              <button class="tool-btn" data-md="bold" title="加粗 (Ctrl+B)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg>
              </button>
              <button class="tool-btn" data-md="italic" title="斜体 (Ctrl+I)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
              </button>
              <button class="tool-btn" data-md="strike" title="删除线">

            </label>
            <label class="export-format-option">
              <input type="radio" name="export-format" value="pdf">
              <div class="export-format-card">
                <div class="export-format-icon">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h1.5a1.5 1.5 0 0 1 0 3H9v-3zM9 16v1.5"/></svg>
                </div>
                <div class="export-format-name">PDF 单篇</div>
                <div class="export-format-desc">每篇独立 PDF 打包</div>
              </div>
            </label>
            <label class="export-format-option">
              <input type="radio" name="export-format" value="pdf-merged">
              <div class="export-format-card">
                <div class="export-format-icon">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
                </div>
                <div class="export-format-name">PDF 合集</div>
                <div class="export-format-desc">所有日记合并为一份</div>
              </div>
            </label>
          </div>
        </div>

        <div class="export-section" id="template-section">
          <div class="export-section-title">PDF 模板</div>
          <div class="export-template-grid" id="export-template-grid">
            <!-- 模板列表由 JS 动态填充 -->
          </div>
        </div>

        <div class="export-section">
          <div class="export-section-title">导出内容</div>
          <div class="export-summary" id="export-summary">已选择 0 篇日记</div>
        </div>

        <div class="export-progress" id="export-progress" style="display:none;">
          <div class="export-progress-bar">
            <div class="export-progress-fill" id="export-progress-fill"></div>
          </div>
          <div class="export-progress-text" id="export-progress-text">正在导出...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="export-modal-cancel">取消</button>
        <button class="btn btn-primary" id="export-modal-confirm">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出
        </button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
